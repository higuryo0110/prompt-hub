<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オフライン | プロンプトシェア</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0a0a0a; color: #e5e5e5; font-family: system-ui, sans-serif;
    }
    .container { text-align: center; padding: 2rem; max-width: 400px; }
    .icon {
      width: 64px; height: 64px; margin: 0 auto 1.5rem;
      border-radius: 16px;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #a3a3a3; font-size: 0.875rem; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: linear-gradient(90deg, #7c3aed, #06b6d4);
      color: white; border: none; padding: 0.75rem 2rem;
      border-radius: 12px; font-size: 0.875rem; font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">&#9889;</div>
    <h1>オフラインです</h1>
    <p>インターネット接続を確認してください。<br>接続が回復すると自動的に復帰します。</p>
    <button onclick="location.reload()">再読み込み</button>
  </div>
</body>
</html>
